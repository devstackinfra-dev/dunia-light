<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dúnia City Hall — Apresentação Executiva para o Proprietário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0C0A09;
      color: #F3EEE6;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem;
      user-select: none;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 1.5rem;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.75rem;
      letter-spacing: 0.2em;
      color: #D3B47C;
      font-weight: 400;
      text-transform: uppercase;
      text-decoration: none;
    }
    .logo span {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: #ABA29A;
      font-family: 'Inter', sans-serif;
    }
    .indicators {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dot {
      height: 8px;
      width: 8px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: all 0.3s;
    }
    .dot.active {
      width: 32px;
      background: #D3B47C;
    }
    main {
      max-width: 1050px;
      margin: auto;
      text-align: center;
      padding: 2.5rem 0;
      width: 100%;
    }
    .slide-tag {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #D3B47C;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      display: block;
    }
    .slide-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      line-height: 1.15;
      color: #FFFFFF;
      margin-bottom: 0.75rem;
    }
    .slide-sub {
      font-size: 0.95rem;
      color: #ABA29A;
      max-width: 680px;
      margin: 0 auto 2rem auto;
      line-height: 1.6;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      text-align: left;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 2rem;
      text-align: left;
    }
    .card {
      background: #161311;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1.25rem;
      padding: 1.75rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card.highlight {
      border: 2px solid #D3B47C;
      background: linear-gradient(180deg, #1C1816 0%, #12100E 100%);
    }
    .card h4 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      color: #FFFFFF;
      margin-top: 0.5rem;
    }
    .card p {
      font-size: 0.85rem;
      color: #ABA29A;
      margin-top: 0.5rem;
      line-height: 1.5;
    }
    .card ul {
      list-style: none;
      margin-top: 1rem;
      font-size: 0.85rem;
    }
    .card ul li {
      padding: 0.35rem 0;
      color: #DFD5CA;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-gold {
      background: #D3B47C;
      color: #100E0D;
      border: none;
    }
    .btn-gold:hover {
      background: #e4c293;
    }
    .btn-outline {
      background: rgba(255,255,255,0.05);
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.1);
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 1.5rem;
      font-size: 0.85rem;
      color: #ABA29A;
    }
    .hide { display: none; }
  </style>
</head>

    let current = 0;
    const content = document.getElementById("slideContent");
    const dotsContainer = document.getElementById("dotsContainer");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function renderDots() {
      dotsContainer.innerHTML = "";
      slides.forEach((_, idx) => {
        const dot = document.createElement("div");
        dot.className = "dot " + (current === idx ? "active" : "");
        dot.onclick = () => { current = idx; renderSlide(); };
        dotsContainer.appendChild(dot);
      });
    }

    function renderSlide() {
      const s = slides[current];
      content.innerHTML = `
        <span class="slide-tag">${s.tag}</span>
        <h2 class="slide-title">${s.title}</h2>
        <p class="slide-sub">${s.sub}</p>
        ${s.html}
      `;
      renderDots();
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === slides.length - 1;
      prevBtn.style.opacity = current === 0 ? "0.3" : "1";
      nextBtn.style.opacity = current === slides.length - 1 ? "0.3" : "1";
    }

    prevBtn.onclick = () => { if (current > 0) { current--; renderSlide(); } };
    nextBtn.onclick = () => { if (current < slides.length - 1) { current++; renderSlide(); } };

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") {
        if (current < slides.length - 1) { current++; renderSlide(); }
      } else if (e.key === "ArrowLeft") {
        if (current > 0) { current--; renderSlide(); }
      }
    });

    renderSlide();
  </script>
</body>
</html>
